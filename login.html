<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Attendance System</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #1E1B4B, #0F172A 70%, #020617);
            position: relative;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Abstract shapes for background */
        .shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 8s infinite alternate ease-in-out;
        }
        .shape-1 {
            width: 400px;
            height: 400px;
            background: #4F46E5;
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }
        .shape-2 {
            width: 500px;
            height: 500px;
            background: #9333EA;
            bottom: -200px;
            right: -100px;
            border-radius: 50%;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            width: 90%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            position: relative;
            z-index: 10;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #CBD5E1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #E2E8F0;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            color: white;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .input-group select option {
            background: #1E293B;
            color: white;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider:not(:empty)::before {
            margin-right: 15px;
        }

        .divider:not(:empty)::after {
            margin-left: 15px;
        }

        .google-auth-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .toast {
            background: #1E293B;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-left: 4px solid var(--primary);
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success { border-color: #10B981; }
        .toast.error { border-color: #EF4444; }

    </style>
</head>

<body>
    <!-- Background Elements -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="container">
        <div class="title">
            <h2>Welcome Back</h2>
            <p>Sign in to the Attendance Portal</p>
        </div>

        <form id="loginForm" onsubmit="login(event)">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your Email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="input-group">
                <label for="role">Login As</label>
                <select id="role">
                    <option value="Student">Student</option>
                    <option value="Faculty">Faculty</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>

            <div style="text-align: center; margin-bottom: 20px; font-size: 13px;">
                <span style="color: var(--text-muted);">Don't have an account?</span>
                <a href="/signup.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">Sign Up</a>
            </div>

            <div class="divider">Or continue with</div>
            
            <div class="google-auth-container">
                <!-- Google ID Service Element -->
                <div id="g_id_onload"
                     data-client_id="1008875525897-f4ojkg1he78oaulsib93lh25dgmqbkoa.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="center">
                </div>
            </div>

            <div class="footer">
                <p>&copy; 2026 Attendance Management System</p>
            </div>
        </form>
    </div>

    <div id="toast-container"></div>

    <script>
        localStorage.removeItem('token');
        localStorage.removeItem('user');

        // The HttpOnly session cookie is shared by localhost:3000 and localhost:3001.
        fetch("/api/session", { credentials: "include" })
            .then(res => {
                if (res.ok) {
                    window.location.href = '/dashboard.html';
                }
            })
            .catch(console.error);

        // Custom Toast logic for better UX
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            // Icon SVG based on type
            const icon = type === 'success' 
                ? `<svg width="20" height="20" fill="none" stroke="#10B981" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`
                : `<svg width="20" height="20" fill="none" stroke="#EF4444" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;

            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);

            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);

            // Remove toast
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        async function handleCredentialResponse(response) {
            try {
                // Show loading state or disable buttons if needed
                const res = await fetch("/api/auth/google", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ credential: response.credential })
                });
                
                const data = await res.json();
                if (data.success) {
                    if (data.isNewUser) {
                        showToast(`Registration Successful! Welcome, ${data.user.name}`, 'success');
                    } else {
                        showToast(`Welcome back, ${data.user.name || 'User'}!`, 'success');
                    }
                    setTimeout(() => window.location.href = '/dashboard.html', 1500);
                } else {
                    showToast("Google Login Failed: " + (data.message || ""), 'error');
                }
            } catch (error) {
                console.error("Error logging in with Google:", error);
                showToast("An error occurred connecting to the server.", 'error');
            }
        }

        async function login(e) {
            e.preventDefault();
            
            const btn = document.querySelector('.btn-submit');
            const originalText = btn.innerText;
            btn.innerText = 'Signing in...';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email, password, role })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(`Login Successful! Welcome, ${data.user.name || email}`, 'success');
                    setTimeout(() => window.location.href = '/dashboard.html', 1500);
                } else {
                    showToast(data.message || "Invalid Credentials", 'error');
                }
            } catch (error) {
                console.error("Login request failed:", error);
                showToast("Server connection failed.", 'error');
            } finally {
                btn.innerText = originalText;
                btn.style.opacity = '1';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
